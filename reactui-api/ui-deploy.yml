apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  labels:
    app: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: ahp1609/reactui:latest 
        env:
          - name: "REACT_APP_BACKEND_SERVER" 
            value: "http://a64c9fbcb0d9f40b2913f3aa3d67169b-863504418.ap-south-1.elb.amazonaws.com/api/"

        ports:
        - containerPort: 3000

